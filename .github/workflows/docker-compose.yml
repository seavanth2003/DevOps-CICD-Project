services:
  employee-app:
    build:
      context: .

    image: employee-management:latest
    container_name: employee-app

    ports:
      - "5000:5000"

    environment:
      DATABASE_PATH: /data/employees.db
      SECRET_KEY: ${SECRET_KEY}

    volumes:
      - employee_data:/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  employee_data:
    external: true