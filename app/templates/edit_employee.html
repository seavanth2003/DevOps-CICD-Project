<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee | HR Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .edit-container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
            animation: fadeUp 0.6s ease;
        }

        .edit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .edit-header h2 {
            font-size: 23px;
            font-weight: 800;
            color: #14213d;
        }

        .edit-header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 7px;
        }

        .back-button {
            color: #2563eb;
            background: #eff6ff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .edit-form-group {
            margin-bottom: 20px;
        }

        .edit-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 9px;
        }

        .edit-form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }

        .edit-form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        .edit-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .cancel-button {
            padding: 12px 20px;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
        }

        @media(max-width: 500px) {
            .edit-container {
                padding: 25px;
            }

            .edit-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

<div class="edit-container">

    <div class="edit-header">

        <div>
            <h2>
                <i class="bi bi-pencil-square text-primary"></i>
                Edit Employee
            </h2>

            <p>Update employee information and save your changes.</p>
        </div>

        <a href="{{ url_for('index') }}" class="back-button">
            <i class="bi bi-arrow-left"></i>
            Back
        </a>

    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST"
          action="{{ url_for('edit_employee', employee_id=employee.id) }}">

        <div class="edit-form-group">

            <label>Employee Name</label>

            <input type="text"
                   name="name"
                   value="{{ employee.name }}"
                   maxlength="100"
                   required>

        </div>


        <div class="edit-form-group">

            <label>Email Address</label>

            <input type="email"
                   name="email"
                   value="{{ employee.email }}"
                   maxlength="254"
                   required>

        </div>


        <div class="edit-form-group">

            <label>Department</label>

            <input type="text"
                   name="department"
                   value="{{ employee.department }}"
                   maxlength="100"
                   required>

        </div>


        <div class="edit-form-group">

            <label>Monthly Salary (₹)</label>

            <input type="number"
                   name="salary"
                   value="{{ employee.salary }}"
                   min="0"
                   step="0.01"
                   required>

        </div>


        <div class="edit-actions">

            <button type="submit" class="primary-button">
                <i class="bi bi-check-circle"></i>
                Update Employee
            </button>

            <a href="{{ url_for('index') }}" class="cancel-button">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
